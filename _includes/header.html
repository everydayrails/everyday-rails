<!DOCTYPE html>

<html lang="en" data-theme-choice="system">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />

  <script>
    // Apply the saved theme before first paint so there's no flash of the
    // wrong colors. No saved choice means follow the system setting.
    (function () {
      var stored = null;
      try { stored = window.localStorage.getItem("theme"); } catch (e) {}
      var choice = stored === "light" || stored === "dark" ? stored : "system";
      var root = document.documentElement;
      root.classList.remove("light", "dark");
      if (choice !== "system") { root.classList.add(choice); }
      root.setAttribute("data-theme-choice", choice);
    })();
  </script>

  <title>
    {% if page.title %}
      {{ page.title }} |
    {% endif %}
    Left of the Dev
  </title>

  <meta name="author" content="Aaron Sumner" />
  <meta name="description" content="{{ page.excerpt }}">
  <meta property="og:image" content="https://leftofthe.dev/images/logo-square.png" />
  <link rel="image_src" href="https://leftofthe.dev/images/logo-square.png" />


  <link href="/css/tailwind.css" rel="stylesheet">
  <link href="/css/tomorrow-night.css" rel="stylesheet">

  <!--[if lt IE 9]>
    <script src="http://html5shim.googlecode.com/svn/trunk/html5.js"></script>
  <![endif]-->

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-icon.png">

  <link href="{{ site.feed }}" rel="alternate" title="RSS" type="application/rss+xml" />

  <script async defer data-domain="leftofthe.dev" src="https://plausible.io/js/plausible.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
