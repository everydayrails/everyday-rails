<!-- Without JS the switcher can't do anything; the system preference still applies. -->
<noscript><style>.theme-switch { display: none; }</style></noscript>

<div class="theme-switch {{ include.class }}" role="group" aria-label="Color theme">
    <button type="button" class="theme-switch-option" data-theme-choice="light" title="Light theme" aria-pressed="false">
        <!-- Sun -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <span class="sr-only">Light theme</span>
    </button>
    <button type="button" class="theme-switch-option" data-theme-choice="system" title="Match system theme" aria-pressed="false">
        <!-- Monitor -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <path d="M8 21h8M12 17v4" />
        </svg>
        <span class="sr-only">Match system theme</span>
    </button>
    <button type="button" class="theme-switch-option" data-theme-choice="dark" title="Dark theme" aria-pressed="false">
        <!-- Moon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
        </svg>
        <span class="sr-only">Dark theme</span>
    </button>
</div>

<script>
    // Theme switcher. The initial choice is applied in the head, before paint;
    // this only handles clicks and keeps the pressed state in sync.
    (function () {
        var options = document.querySelectorAll(".theme-switch-option");
        if (!options.length) { return; }

        function apply(choice) {
            var root = document.documentElement;
            root.classList.remove("light", "dark");
            if (choice !== "system") { root.classList.add(choice); }
            root.setAttribute("data-theme-choice", choice);

            for (var i = 0; i < options.length; i++) {
                var pressed = options[i].getAttribute("data-theme-choice") === choice;
                options[i].setAttribute("aria-pressed", pressed ? "true" : "false");
            }

            try {
                if (choice === "system") {
                    window.localStorage.removeItem("theme");
                } else {
                    window.localStorage.setItem("theme", choice);
                }
            } catch (e) {}
        }

        for (var j = 0; j < options.length; j++) {
            options[j].addEventListener("click", function () {
                apply(this.getAttribute("data-theme-choice"));
            });
        }

        apply(document.documentElement.getAttribute("data-theme-choice") || "system");
    })();
</script>
